# ============================================
# nginx.conf — Oracle Linux 10.X (bare-metal / VM)
# 4 núcleos · 6 GB RAM · tráfico entrante desde Cloudflare
# ============================================
# A diferencia del despliegue en Kubernetes (non-root, logs a stdout),
# aquí nginx corre como servicio systemd: el master arranca como root y
# delega los workers al usuario "nginx". Logs van a /var/log/nginx.

# Usuario de los procesos worker. El master (root) hace bind a puertos
# privilegiados y luego baja privilegios a este usuario en los workers.
user nginx;

# Número de procesos worker. "auto" = 1 por núcleo (4 en esta máquina).
worker_processes auto;

# Fija cada worker a un núcleo (mejor cache locality con 4 cores fijos).
worker_cpu_affinity auto;

# Límite máximo de archivos abiertos por proceso worker.
# OJO: systemd impone su propio LimitNOFILE. Para que este valor tenga
# efecto, el unit de nginx debe incluir (ver nota al pie):
#   [Service]
#   LimitNOFILE=65535
worker_rlimit_nofile 65535;

# Log de errores a archivo (rotar con logrotate, ver /etc/logrotate.d/nginx).
error_log /var/log/nginx/error.log warn;

# Archivo PID (en OL10 /var/run es symlink a /run; usamos la ruta canónica).
pid /run/nginx.pid;

# ============================================
# THREAD POOL para AIO (lectura asíncrona de archivos estáticos)
# ============================================
# Pair con `aio threads`: libera al worker mientras lee archivos grandes
# (HTML server-rendered, bundles JS pesados) desde disco.
thread_pool default threads=32 max_queue=65536;

events {
    # Máximo de conexiones simultáneas por worker.
    # 4 workers × 4096 = 16.384 conexiones concurrentes (holgado para 6 GB).
    worker_connections 4096;

    # Método epoll para Linux.
    use epoll;

    # Aceptar múltiples conexiones simultáneamente.
    multi_accept on;
}


http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Tipos que el visor 3D necesita y que el mime.types de algunas versiones
    # de nginx no trae: el navegador RECHAZA el lector IFC (.wasm) y el worker
    # de fragments (.mjs) si llegan con otro Content-Type, y el modelo no carga.
    # Este bloque se SUMA a mime.types. Si `nginx -t` avisa "duplicate
    # extension", es que mime.types ya los tenía: el aviso es inofensivo.
    types {
        application/wasm        wasm;
        application/javascript  mjs;
    }

    # ============================================
    # LOGGING — formato json
    # ============================================
    # JSON estructurado — fácil de ingerir con Promtail/Fluent Bit/Vector.
    # Incluye variables de upstream y $request_id para correlación.
    log_format main escape=json '{'
      '"time":"$time_iso8601",'
      '"client_ip":"$remote_addr",'
      '"original_remote_addr":"$realip_remote_addr",'
      '"request_id":"$request_id",'
      '"method":"$request_method",'
      '"uri":"$request_uri",'
      '"http_version":"$server_protocol",'
      '"status":$status,'
      '"bytes_sent":$bytes_sent,'
      '"body_bytes_sent":$body_bytes_sent,'
      '"request_time":$request_time,'
      '"upstream_addr":"$upstream_addr",'
      '"upstream_status":"$upstream_status",'
      '"upstream_response_time":"$upstream_response_time",'
      '"upstream_cache_status":"$upstream_cache_status",'
      '"referer":"$http_referer",'
      '"user_agent":"$http_user_agent",'
      '"xff":"$http_x_forwarded_for",'
      '"cf_ray":"$http_cf_ray",'
      '"host":"$host",'
      '"scheme":"$scheme"'
    '}';
    # buffer + flush: reduce syscalls de escritura bajo alta concurrencia.
    access_log /var/log/nginx/access.log main buffer=64k flush=5s;

     # PERFORMANCE
    # ============================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    client_body_timeout 60;
    client_header_timeout 60;
    send_timeout 60;
    # Envía TCP RST en timeouts en lugar de FIN — libera memoria del socket
    # más rápido y evita acumulación de FIN_WAIT1 bajo alta concurrencia.
    reset_timedout_connection on;
    # Lingering close — cierre HTTP-compliant que procesa datos pendientes
    # del cliente antes de cerrar la conexión.
    lingering_close on;
    lingering_time 30s;
    lingering_timeout 5s;
    # AIO threads — lectura asíncrona de archivos sin bloquear el worker.
    aio threads=default;
    aio_write on;

    # Cache de metadatos de archivos abiertos (estáticos servidos del disco).
    # Reduce syscalls stat()/open() repetidos por cada request de asset.
    open_file_cache max=10000 inactive=60s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # ============================================
    # BUFFER SIZES
    # ============================================
    client_body_buffer_size 128k;
    client_max_body_size 10m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;

    # ============================================
    # COMPRESSION
    # ============================================
    gzip on;
    gzip_vary on;
    gzip_proxied no-cache no-store private expired auth;
    gzip_comp_level 6;
    gzip_min_length 1000;
    # application/x-step = modelos IFC (texto: se reducen ~80 %). Sólo aplica si
    # el endpoint ORDS 'documento' devuelve los .ifc con ese Content-Type.
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/wasm application/x-step application/manifest+json application/x-font-ttf font/eot font/otf image/svg+xml;

    # ============================================
    # SECURITY
    # ============================================
    server_tokens off;

    # ============================================
        # REAL IP DETECTION — Cloudflare
    # ============================================
    # El tráfico entra siempre a través de Cloudflare, por lo que $remote_addr
    # sería una IP de Cloudflare. Confiamos en la cabecera CF-Connecting-IP
    # (la IP real del cliente que Cloudflare inyecta) PERO sólo cuando la
    # conexión proviene de un rango de Cloudflare (set_real_ip_from), para
    # que un cliente directo no pueda falsificar su IP.
    #
    # IMPORTANTE: estos rangos cambian. Mantenerlos sincronizados desde:
    #   https://www.cloudflare.com/ips-v4  y  https://www.cloudflare.com/ips-v6
    # (recomendado: cron que regenere este bloque, p.ej. /etc/nginx/cloudflare.conf
    #  vía include, y haga `nginx -t && systemctl reload nginx`).
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;
    # --- Cloudflare IPv4 ---
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    # --- Cloudflare IPv6 ---
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    # ============================================
    # RATE LIMITING
    # ============================================
    # Las zonas se evalúan con $binary_remote_addr, que tras real_ip ya es la
    # IP real del cliente (CF-Connecting-IP) — el rate limit aplica por cliente,
    # no por IP de Cloudflare.
    limit_req_zone $binary_remote_addr zone=req_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Incluir configuraciones de sitios.
    include /etc/nginx/conf.d/*.conf;
}