# ============================================================================
# nginx-dev.conf — vhost del entorno DESARROLLO del Visor de Planos
#
# Convive con el vhost de PRODUCCIÓN (server/nginx-prod.conf) en el MISMO servidor.
# Lo que los separa:
#                        DEV                          PROD
#   server_name   planos-dev.aicsacorp.com      planos.aicsacorp.com
#   root          /usr/share/nginx/html/planos-dev   .../html/planos
#   /ords/  →     https://dev.aicsacorp.com     https://prod.aicsacorp.com
#   /rt/    →     127.0.0.1:3101 (saf-collab-dev)  127.0.0.1:3100 (saf-collab)
#
# INSTALAR:
#   sudo mkdir -p /usr/share/nginx/html/planos-dev
#   sudo cp server/nginx-dev.conf /etc/nginx/conf.d/planos-dev.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# El certificado wildcard *.aicsacorp.com ya cubre planos-dev.aicsacorp.com;
# solo hace falta el registro DNS apuntando a este servidor.
# ============================================================================

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name planos-dev.aicsacorp.com;

    root /usr/share/nginx/html/planos-dev;
    index index.html;
    absolute_redirect off;

    # nginx ELIMINA por defecto los headers con guion bajo (p.ej. codigo_proyecto).
    underscores_in_headers on;

    # --- Certificado wildcard *.aicsacorp.com (el mismo que producción) ---
    ssl_certificate     /etc/nginx/ssl/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/conf.d/security-headers.inc;

    # DEV no se indexa nunca.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # ── ORDS de DESARROLLO ──────────────────────────────────────────────
    location /ords/ {
        proxy_pass_request_headers on;
        proxy_pass              https://dev.aicsacorp.com/ords/;
        proxy_set_header        Host dev.aicsacorp.com;
        proxy_ssl_server_name   on;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_read_timeout      120s;
        client_max_body_size    20m;
    }

    # ── WebSocket de colaboración de DEV (saf-collab-dev, puerto 3101) ──
    location /rt/ {
        proxy_pass         http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_read_timeout 3600s;
    }

    # La aplicación vive en la raíz (con fallback SPA interno).
    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ /index.html;
    }

    location /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy-dev\n";
    }

    # El HTML nunca se cachea: así un deploy a dev se ve al recargar.
    location ~* \.(?:html?)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires epoch;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # Assets con hash en el nombre → cacheables para siempre.
    location ~ "\.[0-9a-f]{8,}\.(js|css|png|jpg|jpeg|gif|webp|svg|woff|woff2|ttf|otf|eot|ico)$" {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }
}
