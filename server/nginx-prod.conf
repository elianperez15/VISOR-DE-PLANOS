# ============================================================================
# nginx-prod.conf — vhost del Visor de Planos (antes docs/nginx.conf)
# Oracle Linux 10.X · SPA en raíz "/" · detrás de Cloudflare
# Certificado: wildcard *.aicsacorp.com (Sectigo)
#
#   URL           https://planos.aicsacorp.com
#   root          /usr/share/nginx/html/planos
#   /ords/  →     $ords_upstream              (ORDS/APEX — ver el bloque)
#   /rt/    →     127.0.0.1:3100              (saf-collab, WebSocket)
#
# ⚠️  ESTE ARCHIVO NO REFLEJA EXACTAMENTE LO QUE CORRE EN EL SERVIDOR.
#     El nginx real usa una variable (`set $ords_upstream ...`) en el bloque
#     location /ords/ que aquí no está. Antes de copiarlo encima, compara:
#       ssh adminsafvsp@192.168.50.163 'sudo sed -n "60,95p" /etc/nginx/conf.d/default.conf'
#
# INSTALAR:
#   sudo cp server/nginx-prod.conf /etc/nginx/conf.d/default.conf
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ============================================
# HTTP :80 — Redirección a HTTPS (+ ACME challenge)
# Solo sirve el reto ACME por HTTP; todo lo demás → 301 a HTTPS.
# ============================================
server {
    listen 80;
    listen [::]:80;

    server_name _;

    # ACME challenge — DEBE seguir accesible por HTTP para renovar el certificado
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Todo lo demás se fuerza a HTTPS conservando ruta y query string.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================
# HTTPS :443 — TLS con wildcard *.aicsacorp.com
# ============================================
server {
    # default_server: atiende también las peticiones por IP o con Host desconocido.
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;

    server_name planos.aicsacorp.com;

    root /usr/share/nginx/html/planos;
    index index.html;
    absolute_redirect off;

    # IMPORTANTE: nginx ELIMINA por defecto los headers HTTP con guion bajo
    # (p.ej. codigo_proyecto). Sin esto, esos headers llegan NULOS a ORDS.
    underscores_in_headers on;

    # --- Certificado wildcard *.aicsacorp.com (Sectigo) ---
    ssl_certificate     /etc/nginx/ssl/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/origin.key;

    # --- Parámetros TLS (perfil moderno/intermedio) ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS — forzar HTTPS en el navegador (1 año)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/nginx/conf.d/security-headers.inc;
    limit_req zone=req_limit burst=20 nodelay;
    limit_conn conn_limit 10;

    # ── ORDS ─────────────────────────────────────────────────────────────
    # ESTA es la ÚNICA línea que decide de qué base salen los planos. El visor
    # solo pide la ruta relativa /ords/safws; no sabe (ni puede saber) a qué
    # ORDS apunta. Cambiar de ORDS = editar esta variable y recargar nginx,
    # SIN recompilar ni redesplegar el visor.
    #
    #   saf.aicsacorp.com  → ORDS/APEX de producción
    #   dev.aicsacorp.com  → ORDS/APEX de desarrollo
    #
    # Hosts verificados el 2026-09-22: ambos responden. prod.aicsacorp.com NO
    # existe (era un valor tomado de un comentario de .env.example).
    #
    # ⚠️  COHERENCIA CON APEX: este host debería ser el mismo que sirve el APEX
    #     que embebe el visor (VITE_APEX_ORIGIN en .env.production), porque es
    #     APEX quien manda los id_en_repositorio por postMessage. Si apuntas
    #     aquí a dev pero APEX es el de producción, estarías buscando IDs de una
    #     base dentro de otra. Ver docs/DESPLIEGUE.md → "Los tres hostnames".
    location /ords/ {
        # ── APUNTANDO A DESARROLLO (temporal) ──
        set $ords_upstream      "dev.aicsacorp.com";

        # Reenvía al upstream los headers del cliente (incluidos los de guion bajo).
        proxy_pass_request_headers on;

        # ⚠️  $request_uri NO ES OPCIONAL AQUÍ.
        #     Cuando proxy_pass contiene una VARIABLE, nginx deja de sustituir el
        #     prefijo del location y manda la URI del directivo tal cual. Con
        #     `proxy_pass https://$ords_upstream/ords/;` el upstream recibía solo
        #     "/ords/" —sin safws/planos-hub/documento— y ORDS respondía con un
        #     302 a /ords/_/landing. El visor recibía esa página HTML y pdf.js la
        #     reportaba como "Invalid PDF structure".
        #     $request_uri lleva la ruta original completa + query string.
        proxy_pass              https://$ords_upstream$request_uri;
        # ORDS enruta según el Host → usa la MISMA variable para que no puedan
        # desincronizarse al cambiar de entorno.
        proxy_set_header        Host $ords_upstream;
        proxy_ssl_server_name   on;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_read_timeout      120s;
        client_max_body_size    20m;
    }

    # Compatibilidad: enlaces antiguos a /planos/ → raíz (preserva el query string).
    location = /planos { return 301 /; }
    location /planos/   { return 301 /; }

    # La aplicación vive en la raíz (con fallback SPA interno).
    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ /index.html;
    }

    location /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/conf.d/security-headers.inc;
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
        expires 7d;
    }

     location ~* \.(?:html?)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires epoch;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    location ~ "\.[0-9a-f]{8,}\.(js|css|png|jpg|jpeg|gif|webp|svg|woff|woff2|ttf|otf|eot|ico)$" {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    location ~* \.(css|js)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    location ~* \.(woff|woff2|ttf|otf|eot)$ {
        add_header Access-Control-Allow-Origin "*" always;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

        location @custom_404_ssl {
        default_type text/html;
        return 404 '<!DOCTYPE html><html><head><title>Not Found</title></head><body><h1>404 - Not Found</h1></body></html>';
    }
    error_page 404 = @custom_404_ssl;

    # ── WebSocket de colaboración de PROD (saf-collab, puerto 3100) ─────
    location /rt/ {
        proxy_pass         http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_read_timeout 3600s;
    }
}
